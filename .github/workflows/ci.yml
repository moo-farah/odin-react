name: Odin CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.9.0'
          cache: 'npm'

      - name: Install Dependencies
        uses: actions/cache@v4 # Optional safeguard, but npm ci handles cache automatically via setup-node
        run: npm ci

      - name: Build Project
        run: npm run build